<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社區草稿</title>
<style>
  @font-face{font-family:CPKai;src:url('../assets/fonts/cp-kai-w7-subset.woff2') format('woff2');font-weight:100 700;}
  @font-face{font-family:CPKai;src:url('../assets/fonts/cp-kai-w9-subset.woff2?v=2') format('woff2');font-weight:800 900;}
  @font-face{font-family:CPKaiFull;src:url('../assets/fonts/df-yankai-simp-trad-w7.ttf') format('truetype');font-weight:100 700;}
  @font-face{font-family:CPKaiFull;src:url('../assets/fonts/df-yankai-simp-trad-w9.ttf') format('truetype');font-weight:800 900;}
  :root{--green:#4E6B4A;--green-d:#3F5A3C;--green-l:#A9BBA4;--cream:#FBF9EF;--paper:#FFFDF6;--ink:#3D2B1F;--ink2:#7A6A5A;--gold:#E2B44E;--or:#DA9B3F;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2E2A26;color:#F3EEE2;font-family:CPKai,CPKaiFull,'Kaiti TC','STKaiti',serif;padding:28px 24px 60px}
  h1{font-size:24px;font-weight:900;letter-spacing:.06em}
  .lead{margin:8px 0 26px;color:#CFC6B5;font-size:14px;line-height:1.7;max-width:1000px}
  .lead b{color:var(--gold)}
  .row{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start}
  .draft{width:375px}
  .tag{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:900;font-size:14px;margin-bottom:8px}
  .draft h2{font-size:18px;font-weight:900;margin-bottom:4px}
  .draft p.d{font-size:13px;color:#CFC6B5;line-height:1.65;margin-bottom:12px;min-height:66px}
  .phone{position:relative;width:375px;height:780px;border-radius:40px;overflow:hidden;background:var(--cream);color:var(--ink);box-shadow:0 16px 40px rgba(0,0,0,.45)}
  .scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:0 0 120px}
  .scroll::-webkit-scrollbar{display:none}
  .nav{position:absolute;left:0;right:0;bottom:0;height:86px;background:linear-gradient(rgba(251,249,239,0),var(--cream) 40%);z-index:5}
  .nav::after{content:'底部導航列';position:absolute;left:50%;bottom:20px;translate:-50% 0;padding:10px 60px;border-radius:30px;background:#E6E2D3;color:#A79C8C;font-size:12px}

  /* 頂部 */
  .top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:52px 16px 10px;background:var(--cream)}
  .tabs{display:flex;gap:18px;align-items:flex-end}
  .tabs a{font-size:17px;font-weight:900;color:#B9AE9E;padding-bottom:4px;border-bottom:3px solid transparent}
  .tabs a.on{color:var(--ink);border-color:var(--or)}
  .ics{margin-left:auto;display:flex;gap:12px}
  .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--or)}
  .ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .ic.dot{position:relative}.ic.dot::after{content:'';position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:#C0605A}
  .seg{display:flex;padding:3px;border-radius:999px;background:#ECE7D6}
  .seg a{padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:900;color:var(--ink2)}
  .seg a.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* 卡片通用 */
  .who{display:flex;align-items:center;gap:8px}
  .who img{width:36px;height:36px;border-radius:50%;border:2px solid #E2DACA;background:#FBF4E4;object-fit:cover}
  .who b{font-size:15px;font-weight:900}.who small{display:block;font-size:11.5px;color:var(--ink2)}
  .acts{display:flex;gap:16px;color:var(--ink2);font-size:12.5px;font-weight:800;align-items:center}
  .acts span{display:flex;align-items:center;gap:4px}
  .acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
  .acts .on{color:#C0605A}.acts .on svg{fill:#C0605A;stroke:#C0605A}
  .map{position:relative;background:url(../assets/social/parts/map-route.png) center top/cover;border-radius:14px}
  .stat{position:absolute;left:10px;top:10px;padding:6px 10px;border-radius:10px;background:rgba(255,253,246,.94);border:2px solid var(--ink);font:800 12px/1.5 'Nunito',CPKai,sans-serif}
  .foods{display:flex;gap:6px;flex-wrap:wrap}
  .fchip{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 4px;border-radius:999px;background:#FFF4D8;border:1.5px solid #EBCB7E;font-size:12px;font-weight:900;color:#7A5A20}
  .fchip img{width:26px;height:26px;object-fit:cover;object-position:18% 50%;border-radius:50%;background:#fff}
  .fchip.n{background:#FFE9D6;border-color:#E9A774;color:#8A4A1E}
  .route{font-size:12px;color:var(--ink2);font-weight:800}

  /* P */
  .pcard{margin:0 14px 14px;padding:12px;border-radius:18px;background:var(--paper);border:1.5px solid #E6DFCC;box-shadow:0 2px 0 rgba(61,43,31,.05)}
  .pcard .map{height:220px;margin:10px 0}
  .pcard .bot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}

  /* Q 足跡故事 */
  .stories{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
  .stories::-webkit-scrollbar{display:none}
  .st{flex:0 0 auto;text-align:center;font-size:11px;font-weight:800;color:var(--ink2)}
  .st i{display:block;width:58px;height:58px;border-radius:50%;padding:3px;background:conic-gradient(var(--or),#F2C14E,var(--green),var(--or));margin-bottom:4px}
  .st i img{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--cream);object-fit:cover;background:#FBF4E4}
  .st.add i{background:#E6E2D3;display:grid;place-items:center;font-style:normal;font-size:24px;color:var(--ink2)}
  .st.seen i{background:#D8D2C2}
  .qcard{margin:0 0 16px;border-top:1.5px solid #ECE6D6;padding-top:12px}
  .qcard .who{padding:0 16px}
  .qcard .map{height:300px;border-radius:0;margin:10px 0 8px}
  .qcard .acts{padding:0 16px}
  .qcard .cap{padding:6px 16px 0;font-size:13px;line-height:1.55}
  .qcard .foods{padding:8px 16px 0}

  /* R 雙欄 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
  .gc{background:var(--paper);border:1.5px solid #E6DFCC;border-radius:14px;overflow:hidden}
  .gc .map{height:150px;border-radius:0}
  .gc .map .km{position:absolute;right:6px;bottom:6px;padding:2px 8px;border-radius:999px;background:rgba(61,43,31,.75);color:#fff;font:800 11px 'Nunito',sans-serif}
  .gc .b{padding:8px}
  .gc .who img{width:22px;height:22px}.gc .who b{font-size:12.5px}
  .gc .route{margin:4px 0;font-size:11px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .gc .acts{gap:10px;font-size:11px}.gc .acts svg{width:14px;height:14px}
  .feat{margin:0 12px 12px;border-radius:16px;overflow:hidden;position:relative}
  .feat .map{height:180px;border-radius:0}
  .feat .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 10px;background:linear-gradient(transparent,rgba(30,22,15,.8));color:#fff}
  .feat .cap b{font-size:15px}.feat .cap small{display:block;font-size:11.5px;opacity:.9}
  .feat .badge{position:absolute;left:10px;top:10px;padding:3px 10px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:11.5px;font-weight:900}

  /* S 日記本 */
  .scard{margin:0 14px 18px;background:#fff;padding:10px 10px 12px;border-radius:6px;box-shadow:0 4px 12px rgba(61,43,31,.15);transform:rotate(-1deg)}
  .scard:nth-child(even){transform:rotate(1deg)}
  .scard .tape{position:absolute;left:50%;top:-10px;width:70px;height:20px;margin-left:-35px;background:rgba(226,180,78,.55);transform:rotate(-3deg)}
  .scard{position:relative}
  .scard .map{height:200px;border-radius:3px}
  .scard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .scard .hand{font-size:14px;font-weight:900;margin:8px 2px 0;line-height:1.5}
  .note{margin-top:16px;padding:12px 14px;border-radius:12px;background:#3A3530;color:#E6DFD0;font-size:12.5px;line-height:1.7;max-width:1640px}
  .note b{color:var(--gold)}
</style>
</head>
<body>
<h1>社區・重做草稿</h1>
<p class="lead">拿掉頂部大大的「社區」膠囊，改成<b>小小的「朋友｜世界」</b>切換。每張動態的重點是<b>那天走的路線地圖</b>＋<b>收集到的美食</b>＋按讚留言。四種不同的排法：</p>
<div class="row" id="rows"></div>
<div class="note"><b>四種都一樣</b>：右上只留「通知（有紅點）」和「＋ 發佈」；朋友／世界切換文字變小，不佔版面。食物圖鑑從左邊一大塊縮成一排小標籤。選一個（或混搭）我再做進正式版。</div>
<script>
const I={like:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.6A4 4 0 0 1 12 7.6a4 4 0 0 1 7 2.8C19 15.6 12 20 12 20z"/></svg>',cmt:'<svg viewBox="0 0 24 24"><path d="M4 11.5C4 7.4 7.6 5 12 5s8 2.4 8 6.5S16.4 18 12 18c-1.1 0-2.1-.1-3-.4L5 19l1-3.2C4.7 14.7 4 13.2 4 11.5z"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
 bell:'<svg viewBox="0 0 24 24"><path d="M12 4c-3.2 0-5 2.4-5 5.6v3.6L5 17h14l-2-3.8V9.6C17 6.4 15.2 4 12 4zM10 19.5a2.2 2.2 0 0 0 4 0"/></svg>',plus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>'};
const U={gentleman:['紳士雞','../assets/social/parts/avatar-gentleman.png'],bear:['大衣熊','../assets/emoji/smug.png'],dream:['甜夢','../assets/emoji/yawn.png'],mei:['阿美','../assets/emoji/hungry.png'],kit:['Kit','../assets/emoji/spotlight.png'],duck:['小黃鴨','../assets/emoji/love.png'],sam:['Sam仔','../assets/emoji/thumbs-up.png']};
const F={pine:['菠蘿油','food-pineapple-bun',1],roll:['腸粉','food-rice-roll',1],beef:['牛肉治','food-beef-sandwich',0],toast:['奶油多','food-butter-toast',0]};
const POSTS=[{u:'gentleman',t:'16小時前',d:'2026.06.05',km:'5.6',n:10,f:['pine','roll'],like:10,cmt:8,star:2,route:'上環・西港城・理工大學',cap:'今天跟 Lucky 走了一圈，菠蘿油真的要趁熱吃！',liked:1},
 {u:'bear',t:'1天前',d:'2026.06.04',km:'10.1',n:10,f:['pine','beef','toast','roll'],like:23,cmt:5,star:6,route:'海安咖啡・西港城・紅磡',cap:'一口氣收了四張美食圖鑑 💪'},
 {u:'dream',t:'2天前',d:'2026.06.03',km:'3.2',n:6,f:['toast'],like:7,cmt:2,star:1,route:'中環街市・海安咖啡',cap:'下雨天也要出來走走'}];
const who=(p,extra='')=>`<div class="who"><img src="${U[p.u][1]}"><div><b>${U[p.u][0]}</b><small>${p.t}${extra}</small></div></div>`;
const acts=p=>`<div class="acts"><span class="${p.liked?'on':''}">${I.like}${p.like}</span><span>${I.cmt}${p.cmt}</span><span>${I.star}${p.star}</span><span>${I.share}</span></div>`;
const foods=p=>`<div class="foods">${p.f.map(k=>`<span class="fchip${F[k][2]?' n':''}"><img src="../assets/social/parts/${F[k][1]}.png">${F[k][0]}</span>`).join('')}</div>`;
const stat=p=>'';   // 路線圖本身已經印了日期／公里／貓點
const topBar=(left)=>`<div class="top">${left}<div class="ics"><span class="ic dot">${I.bell}</span><span class="ic">${I.plus}</span></div></div>`;
const drafts=[
 ['草稿 P・乾淨卡片','標題拿掉，只剩小分頁','頂部是兩個小字分頁「朋友 世界」＋右邊兩個小圖示。每張卡：作者在最上、路線地圖在中間（數據貼在左上角）、美食變成一排小標籤、按讚在最下面。最接近現在，但清爽很多。',
  topBar('<div class="tabs"><a class="on">朋友</a><a>世界</a></div>')+POSTS.map(p=>`<div class="pcard">${who(p)}<div class="map">${stat(p)}</div>${foods(p)}<div class="bot"><span class="route">📍 ${p.route}</span>${acts(p)}</div></div>`).join('')],
 ['草稿 Q・朋友足跡＋滿版地圖','像社交 App：上面一排朋友的頭像','頂部一排朋友頭像（今天有走的有彩色圈），點頭像看他今天的路線。下面每則動態地圖滿版、更大，附一句話和美食標籤。最有「社區」的感覺。',
  topBar('<div class="seg"><a class="on">朋友</a><a>世界</a></div>')+`<div class="stories"><div class="st add"><i>＋</i>我的今天</div>${['gentleman','bear','dream','duck','sam'].map((k,i)=>`<div class="st${i>2?' seen':''}"><i><img src="${U[k][1]}"></i>${U[k][0]}</div>`).join('')}</div>`+POSTS.map(p=>`<div class="qcard">${who(p,'・'+p.km+'km・'+p.n+' 個貓點')}<div class="map"></div>${acts(p)}<div class="cap"><b>${U[p.u][0]}</b> ${p.cap}</div>${foods(p)}</div>`).join('')],
 ['草稿 R・精選＋雙欄','一屏看到更多路線','最上面一張「本週最熱門路線」，下面雙欄小卡（地圖＋公里數＋路線名）。一次看到很多條路線，適合「世界」那邊內容多的時候逛。',
  topBar('<div class="seg"><a>朋友</a><a class="on">世界</a></div>')+`<div class="feat"><span class="badge">🔥 本週最熱門</span><div class="map"></div><div class="cap"><b>紅磡・尖沙咀長征</b><small>Kit・12.3km・15 個貓點・♥ 342</small></div></div><div class="grid">${[...POSTS,...POSTS.slice(0,3)].map((p,i)=>`<div class="gc"><div class="map" style="background-position:${['center 20%','center 60%','center 40%'][i%3]}"><span class="km">${p.km}km</span></div><div class="b">${who(p)}<div class="route">📍 ${p.route}</div>${acts(p).replace(/<span>[^<]*<svg[^]*?<\/svg><\/span>$/,'')}</div></div>`).join('')}</div>`],
 ['草稿 S・手帳拼貼','每則動態像一頁貼上去的日記','延續回憶牆／日記的手帳風：每則動態是一張貼了膠帶的紙，上面是路線地圖、手寫一句話、美食標籤。最有 CityPaws 的味道，資訊比較少。',
  topBar('<div class="tabs"><a class="on">朋友</a><a>世界</a></div>')+'<div style="padding-top:8px">'+POSTS.map(p=>`<div class="scard"><i class="tape"></i>${who(p)}<div class="map" style="margin-top:8px">${stat(p)}</div><div class="hand">「${p.cap}」</div><div class="meta">${foods(p)}</div><div class="meta">${acts(p)}</div></div>`).join('')+'</div>']
];
document.getElementById('rows').innerHTML=drafts.map(([t,h,d,inner])=>`<div class="draft"><span class="tag">${t}</span><h2>${h}</h2><p class="d">${d}</p><div class="phone"><div class="scroll">${inner}</div><div class="nav"></div></div></div>`).join('');
</script>
</body>
</html>
