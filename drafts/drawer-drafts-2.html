<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日記抽屜草稿 2</title>
<style>
  @font-face{font-family:CPKai;src:url('../assets/fonts/cp-kai-w7-subset.woff2') format('woff2');font-weight:100 700;}
  @font-face{font-family:CPKai;src:url('../assets/fonts/cp-kai-w9-subset.woff2?v=2') format('woff2');font-weight:800 900;}
  @font-face{font-family:CPKaiFull;src:url('../assets/fonts/df-yankai-simp-trad-w7.ttf') format('truetype');font-weight:100 700;}
  @font-face{font-family:CPKaiFull;src:url('../assets/fonts/df-yankai-simp-trad-w9.ttf') format('truetype');font-weight:800 900;}
  :root{--green:#4E6B4A;--green-d:#3F5A3C;--green-l:#A9BBA4;--cream:#FBFAEA;--paper:#FFFDF6;--ink:#3D2B1F;--ink2:#7A6A5A;--gold:#E2B44E;--wood:#C9A27A;--wood-d:#9C7651;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2E2A26;color:#F3EEE2;font-family:CPKai,CPKaiFull,'Kaiti TC','STKaiti',serif;padding:28px 24px 60px}
  h1{font-size:24px;font-weight:900;letter-spacing:.06em}
  .lead{margin:8px 0 26px;color:#CFC6B5;font-size:14px;line-height:1.7;max-width:1000px}
  .lead b{color:var(--gold)}
  .row{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start}
  .draft{width:375px}
  .tag{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:900;font-size:14px;margin-bottom:8px}
  .draft h2{font-size:18px;font-weight:900;margin-bottom:4px}
  .draft p.d{font-size:13px;color:#CFC6B5;line-height:1.65;margin-bottom:12px;min-height:66px}
  .try{color:var(--gold);font-weight:900}
  .phone{position:relative;width:375px;height:780px;border-radius:40px;overflow:hidden;background:var(--cream) url(board/polas.jpg) center 70px/100% auto no-repeat;color:var(--ink);box-shadow:0 16px 40px rgba(0,0,0,.45)}
  .phone::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(251,250,234,.55),rgba(251,250,234,.35) 40%,rgba(251,250,234,.9) 62%)}
  .back{position:absolute;left:14px;top:46px;width:40px;height:40px;border-radius:50%;border:3px solid #4E3325;background:#FFFDF4;display:grid;place-items:center;font-size:20px;font-weight:900;color:#4E3325;z-index:5}
  .ttl{position:absolute;left:0;right:0;top:52px;text-align:center;font-size:21px;font-weight:900;letter-spacing:.14em;z-index:5}
  .hint{position:absolute;z-index:5;left:50%;translate:-50% 0;padding:7px 16px;border:2.5px solid var(--green);border-radius:12px;background:var(--paper);font-size:13px;font-weight:900;letter-spacing:.12em;white-space:nowrap}
  .card-page{position:absolute;left:24px;right:24px;top:96px;height:520px;border-radius:12px;background:#fff url(board/day512.jpg?v=2) center top/cover;box-shadow:0 10px 26px rgba(61,43,31,.3);z-index:4;
    transform:translateY(120%);opacity:0;transition:transform .55s cubic-bezier(.3,.9,.3,1),opacity .2s;}
  .phone.pulled .card-page{transform:none;opacity:1}
  .phone.pulled .stage{filter:blur(1px) brightness(.9)}

  /* ── K1：木製索引卡盒 ── */
  .box1{position:absolute;left:22px;right:22px;bottom:0;height:330px;z-index:2}
  .box1 .cards{position:absolute;left:14px;right:14px;top:10px;height:200px}
  .box1 .c{position:absolute;left:0;right:0;height:150px;border-radius:12px 12px 0 0;background:var(--paper);border:2.5px solid var(--green);cursor:pointer;transition:transform .25s}
  .box1 .c::before{content:attr(data-d);position:absolute;top:-30px;height:32px;padding:0 16px;display:flex;align-items:center;border-radius:10px 10px 0 0;background:var(--paper);border:2.5px solid var(--green);border-bottom:none;
    font:900 15px 'Nunito',CPKai,serif;color:var(--ink);letter-spacing:.04em}
  .box1 .c.p0::before{left:8%}.box1 .c.p1::before{left:38%}.box1 .c.p2::before{left:62%}
  .box1 .c::after{content:'';position:absolute;inset:8px 10px auto;height:100px;background:repeating-linear-gradient(transparent 0 15px,#E4E6DA 15px 16px)}
  .box1 .c:hover{transform:translateY(-10px)}
  .box1 .c.new::before{background:#FFF1C9;border-color:#D9A94A}
  .box1 .c.new{border-color:#D9A94A}
  .box1 .front{position:absolute;z-index:20;left:0;right:0;bottom:0;height:150px;border-radius:14px 14px 0 0;background:linear-gradient(#D6B288,#C29B70);border:3px solid var(--wood-d);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
  .box1 .front::before{content:'';position:absolute;inset:10px;border-radius:10px;border:2px dashed rgba(110,78,48,.35)}
  .box1 .label{position:absolute;left:50%;top:26px;translate:-50% 0;padding:6px 18px;border-radius:6px;background:#FFFBEF;border:2px solid var(--wood-d);font-size:15px;font-weight:900;letter-spacing:.12em;box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .box1 .handle{position:absolute;left:50%;top:78px;width:90px;height:16px;margin-left:-45px;border-radius:0 0 40px 40px;background:#7E5B3A;box-shadow:inset 0 3px 3px rgba(0,0,0,.35)}

  /* ── K2：綠色文件夾斜疊（像翻檔案） ── */
  .box2{position:absolute;left:0;right:0;bottom:0;height:360px;z-index:2;perspective:800px}
  .box2 .f{position:absolute;left:30px;right:30px;height:120px;border-radius:4px 14px 14px 14px;cursor:pointer;transition:transform .25s;transform-origin:50% 100%;transform:rotateX(18deg);box-shadow:0 -2px 6px rgba(61,43,31,.12)}
  .box2 .f span{position:absolute;top:-26px;left:0;height:28px;padding:0 14px;display:flex;align-items:center;border-radius:10px 10px 0 0;font:900 14px 'Nunito',CPKai,serif;color:#fff}
  .box2 .f:hover{transform:rotateX(8deg) translateY(-14px)}
  .box2 .f b{position:absolute;right:14px;top:12px;font-size:11.5px;font-weight:800;color:rgba(255,255,255,.85)}
  .box2 .stand{position:absolute;z-index:20;left:18px;right:18px;bottom:0;height:120px;border-radius:16px 16px 0 0;background:var(--paper);border:3px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;letter-spacing:.14em;color:var(--green-d)}
  .box2 .stand::before{content:'';position:absolute;inset:8px;border:2px dashed var(--green-l);border-radius:10px}

  /* ── K3：手帳側邊索引 ── */
  .book{position:absolute;left:24px;right:52px;top:120px;bottom:40px;border-radius:6px 16px 16px 6px;background:var(--paper);border:3px solid var(--green);box-shadow:6px 6px 0 rgba(78,107,74,.18);z-index:2;overflow:visible}
  .book::before{content:'';position:absolute;left:18px;top:0;bottom:0;border-left:2px dashed var(--green-l)}
  .book .pv{position:absolute;left:30px;right:14px;top:16px;bottom:16px;border-radius:8px;background:url(board/day512.jpg?v=2) center 18%/cover;opacity:.92}
  .book .tabs{position:absolute;right:-46px;top:20px;display:flex;flex-direction:column;gap:6px}
  .book .tabs a{display:block;width:48px;padding:10px 0;border-radius:0 10px 10px 0;text-align:center;font:900 12px/1.25 'Nunito',CPKai,serif;color:#fff;cursor:pointer;writing-mode:vertical-rl;letter-spacing:.06em;box-shadow:2px 2px 0 rgba(0,0,0,.12)}
  .book .tabs a.on{transform:translateX(6px)}

  /* ── K4：抽屜從上往下看（打開的盒子） ── */
  .box4{position:absolute;left:18px;right:18px;bottom:22px;height:420px;z-index:2;border-radius:18px;background:linear-gradient(#B98F63,#A27A50);border:3px solid #7E5B3A;padding:18px 16px;box-shadow:0 8px 18px rgba(61,43,31,.3)}
  .box4 .in{position:absolute;inset:14px;border-radius:12px;background:#8D6A45;box-shadow:inset 0 8px 14px rgba(0,0,0,.35)}
  .box4 .r{position:absolute;left:24px;right:24px;height:54px;border-radius:10px;background:var(--paper);display:flex;align-items:center;gap:10px;padding:0 12px;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;transition:transform .2s}
  .box4 .r:hover{transform:translateY(-6px) scale(1.02)}
  .box4 .r i{width:38px;height:38px;border-radius:6px;background:url(board/day512.jpg?v=2) center 25%/cover;flex-shrink:0}
  .box4 .r b{font:900 15px 'Nunito',CPKai,serif}.box4 .r small{display:block;font-size:11px;color:var(--ink2)}
  .box4 .r em{margin-left:auto;font-style:normal;font-size:11px;padding:2px 8px;border-radius:999px;background:#EEF1E7;color:var(--green-d);font-weight:900}
  .box4 .r.lock{opacity:.6}.box4 .r.lock i{background:#E6E2D3}
  .box4 .lab{position:absolute;left:50%;top:-16px;translate:-50% 0;padding:5px 16px;border-radius:8px;background:#FFFBEF;border:2px solid #7E5B3A;font-size:14px;font-weight:900;letter-spacing:.12em;z-index:3}
  .note{margin-top:16px;padding:12px 14px;border-radius:12px;background:#3A3530;color:#E6DFD0;font-size:12.5px;line-height:1.7;max-width:1640px}
  .note b{color:var(--gold)}
</style>
</head>
<body>
<h1>日記抽屜・重新設計（抽屜本身）</h1>
<p class="lead">抽屜改成<b>用程式畫</b>，不再用一張圖補來補去：每個日期文件夾都是獨立的、可以點、可以有動畫。四種方向，<span class="try">都可以點日期試試（會抽出 5.12）</span>。</p>
<div class="row" id="rows"></div>
<div class="note"><b>四種都一樣</b>：底部沒有導航、左上「←」回地圖；最新一天的文件夾特別標出來；還沒整理好的日子點了會提示。抽出來的日記頁、收回去的動畫沿用現在的。</div>
<script>
const D=['2026.5.10','2026.5.11','2026.5.12','2026.5.13','2026.5.14','2026.5.15'];
const COL=['#6E8A68','#C98B5B','#4E6B4A','#B9A16A','#8B6A58','#5E7F8E'];
const shell=(inner,hintTop)=>`<span class="back">←</span><div class="ttl">我的日記</div><div class="stage">${inner}</div><div class="hint" style="top:${hintTop}px">點擊檔案日期查看</div><div class="card-page"></div>`;
const k1=shell(`<div class="box1"><div class="cards">${D.slice().reverse().map((d,i)=>`<div class="c p${i%3}${d==='2026.5.12'?' new':''}" data-d="${d}" style="top:${i*24}px;z-index:${i}"></div>`).join('')}</div><div class="front"><span class="label">2026 年 5 月</span><span class="handle"></span></div></div>`,330);
const k2=shell(`<div class="box2">${D.map((d,i)=>`<div class="f" data-d="${d}" style="bottom:${100+ (5-i)*36}px;background:${COL[i]};z-index:${i}"><span style="background:${COL[i]};left:${[6,30,54,18,42,66][i]}%">${d.slice(5)}</span>${d==='2026.5.12'?'<b>★ 最新</b>':''}</div>`).join('')}<div class="stand">2026 年 5 月</div></div>`,170);
const k3=shell(`<div class="book"><div class="pv"></div><div class="tabs">${D.map((d,i)=>`<a data-d="${d}" class="${d==='2026.5.12'?'on':''}" style="background:${COL[i]}">${d.slice(5)}</a>`).join('')}</div></div>`,96);
const k4=shell(`<div class="box4"><span class="lab">2026 年 5 月</span><div class="in"></div>${D.slice().reverse().map((d,i)=>`<div class="r${d==='2026.5.12'?'':' lock'}" data-d="${d}" style="top:${30+i*62}px"><i></i><div><b>${d}</b><small>${d==='2026.5.12'?'理工大學・海安咖啡・西港城':'還在整理中…'}</small></div>${d==='2026.5.12'?'<em>4 個貓點</em>':''}</div>`).join('')}</div>`,290);
const drafts=[['草稿 D1・木製索引卡盒','像圖書館的卡片抽屜','木頭抽屜正面有「2026 年 5 月」標籤和把手，一張張日期卡片插在裡面露出標籤，滑過會往上彈一點。最新一天的卡片是金色的。最有實體感。',k1],
 ['草稿 D2・彩色文件夾','每天一個顏色，斜斜疊在架子上','每一天是一個彩色文件夾（顏色不同好分辨），斜靠在綠色的檔案架上，標籤錯開排。點一下文件夾往上抽出。最活潑、最好點。',k2],
 ['草稿 D3・手帳側邊索引','像翻手帳，右邊一排日期索引','整本日記像一本手帳，最新一天直接攤開在中間；右邊是彩色的日期索引標籤，點哪一天就翻到哪一天。上面不會空。',k3],
 ['草稿 D4・打開的抽屜（俯視）','從上往下看，像一排卡片清單','打開的木抽屜，裡面每一天一張卡片（縮圖＋去過哪些地方＋貓點數），還沒整理好的灰灰的。資訊最清楚，最像清單。',k4]];
document.getElementById('rows').innerHTML=drafts.map(([t,h,d,inner])=>`<div class="draft"><span class="tag">${t}</span><h2>${h}</h2><p class="d">${d}</p><div class="phone">${inner}</div></div>`).join('');
document.querySelectorAll('.phone').forEach(ph=>{
  ph.querySelectorAll('[data-d]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); if(el.dataset.d!=='2026.5.12'){ el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300}); return; } ph.classList.add('pulled'); });
  ph.querySelector('.card-page').onclick=()=>ph.classList.remove('pulled');
});
</script>
</body>
</html>
