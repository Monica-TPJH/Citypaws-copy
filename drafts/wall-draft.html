<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冰室收集牆草稿</title>
<style>
  @font-face{font-family:CPKai;src:url('../assets/fonts/cp-kai-w7-subset.woff2') format('woff2');font-weight:100 700;}
  @font-face{font-family:CPKai;src:url('../assets/fonts/cp-kai-w9-subset.woff2?v=2') format('woff2');font-weight:800 900;}
  @font-face{font-family:CPKaiFull;src:url('../assets/fonts/df-yankai-simp-trad-w7.ttf') format('truetype');font-weight:100 700;}
  @font-face{font-family:CPKaiFull;src:url('../assets/fonts/df-yankai-simp-trad-w9.ttf') format('truetype');font-weight:800 900;}
  :root{--f:CPKai,CPKaiFull,'Kaiti TC',serif;--ink:#3D2B1F;--wood:#B8803C;--g:#4E6B4A;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2E2A26;color:#F3EEE2;font-family:var(--f);padding:24px;display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
  .side{max-width:380px;font-size:14px;line-height:1.8;color:#D8CFBF}
  .side h1{font-size:22px;color:#F3EEE2;margin-bottom:8px}
  .side b{color:#E2B44E}
  .phone{position:relative;width:402px;height:874px;border-radius:40px;overflow:hidden;color:var(--ink);box-shadow:0 16px 40px rgba(0,0,0,.45);
    background:#F6EDD9 url(../assets/ui/bingshi-wall.jpg) center top/100% auto no-repeat;}
  .frame,.tiles,.table{display:none !important;}   /* 牆、畫框、磁磚、木桌都在背景圖裡 */
  /* 返回鍵 */
  .back{position:absolute;left:16px;top:52px;width:44px;height:46px;background:url(../assets/ui/btn-back.png) center/100% 100%;border:none;z-index:20;cursor:pointer}
  .ttl{display:none;position:absolute;left:0;right:0;top:62px;text-align:center;font:900 21px var(--f);letter-spacing:.2em;color:var(--ink)}
  /* 畫框＋地圖 */
  .frame{position:absolute;left:0;right:0;top:112px;height:410px;}
  .frame .bar{position:absolute;left:0;right:0;height:13px;background:linear-gradient(#D7A65E,#B07A35 60%,#8E5E27);box-shadow:0 2px 3px rgba(61,43,31,.25)}
  .frame .bar.t{top:0}.frame .bar.b{bottom:0}
  .map{position:absolute;left:8px;right:8px;top:13px;bottom:13px;overflow:hidden;background:#EFE6CC;}
  .map .base{position:absolute;inset:-10%;background:url(../assets/map/fakemap.jpg) 40% 45%/150% auto;filter:sepia(.5) saturate(.9) hue-rotate(30deg) brightness(1.02) contrast(.95);opacity:1}
  .map::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(150,110,60,.25));pointer-events:none}
  .map svg.routes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .paw{position:absolute;width:16px;height:16px;opacity:.75}
  /* 便利貼 */
  /* 便利貼用原本回憶牆圖上的那幾張（切出來放大），只把進度數字換成實際的 */
  .note{position:absolute;width:var(--w);translate:-50% -50%;cursor:pointer;z-index:3;filter:drop-shadow(2px 4px 4px rgba(61,43,31,.3));transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .25s,filter .25s;}
  .note img{display:block;width:100%;height:auto;}
  .note small{position:absolute;left:50%;bottom:14%;translate:-50% 0;min-width:42%;text-align:center;padding:1px 6px;border-radius:999px;background:var(--c);font:800 12px var(--f);color:#5A4436;box-shadow:0 0 0 3px var(--c);}
  .note small.zero{color:#9A8C7C}
  .note-old{position:absolute;width:var(--w);min-height:60px;padding:18px 4px 7px;text-align:center;cursor:pointer;z-index:3;
    background:repeating-linear-gradient(transparent 0 15px,rgba(120,100,70,.12) 15px 16px),var(--c);
    box-shadow:2px 4px 6px rgba(61,43,31,.28);transform:rotate(var(--r));transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .25s,filter .25s;}
  .note-old::after{content:'';position:absolute;right:0;bottom:0;width:16px;height:16px;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.12) 50%);}
  .note-old b{display:block;font:900 13px/1.3 var(--f);letter-spacing:.1em}
  .note-old small{display:inline-block;margin-top:3px;padding:0 6px;border-radius:999px;background:rgba(78,107,74,.14);font:700 11px var(--f);color:var(--g)}
  .pin{position:absolute;left:50%;top:-8px;translate:-50% 0;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0 18%,var(--p) 20%);box-shadow:0 2px 2px rgba(0,0,0,.3)}
  .pin::after{content:'';position:absolute;left:50%;top:15px;width:2px;height:8px;background:#8a8a8a;translate:-50% 0}
  .phone.picked .note:not(.on){opacity:.55;filter:saturate(.6)}
  .note.on{transform:scale(1.12);z-index:5}
  .note.hint{animation:nb 2.4s ease-in-out infinite}
  @keyframes nb{0%,100%{transform:none}8%{transform:translateY(-4px)}16%{transform:none}}
  /* 牆面磁磚＋木桌 */
  .tiles{position:absolute;left:0;right:0;top:540px;height:334px;background:#B9CFA6;
    background-image:linear-gradient(#9FB78B 2px,transparent 2px),linear-gradient(90deg,#9FB78B 2px,transparent 2px);background-size:57px 44px;}
  .table{position:absolute;left:0;right:0;top:648px;height:100px;z-index:4;
    background:linear-gradient(#E1A456,#C98637 45%,#B37127);box-shadow:0 6px 0 #8E5A22,0 10px 14px rgba(61,43,31,.3);}
  .table::before{content:'';position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(90deg,transparent 0 37px,rgba(120,70,20,.35) 37px 38px,transparent 38px 91px),repeating-linear-gradient(transparent 0 9px,rgba(255,240,200,.25) 9px 10px);}
  /* Lucky + 對話框 */
  .lucky{position:absolute;right:18px;top:588px;width:104px;z-index:6;transition:right .5s cubic-bezier(.3,1,.4,1),opacity .4s;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2))}
  .phone.picked .lucky{right:-120px;opacity:0}
  .bub{position:absolute;right:120px;top:592px;max-width:236px;padding:10px 14px;background:#FFFDF6;border:2.5px solid #5C4A3D;border-radius:16px;z-index:7;
    font:700 14px/1.5 var(--f);color:var(--ink);letter-spacing:.04em;box-shadow:0 3px 0 rgba(61,43,31,.15);transition:right .5s,opacity .3s}
  .bub::after{content:'';position:absolute;right:-10px;top:22px;width:14px;height:14px;background:#FFFDF6;border:2.5px solid #5C4A3D;border-left:none;border-bottom:none;transform:rotate(45deg)}
  .phone.picked .bub{right:84px}
  /* 桌上的收集品 */
  .tray{position:absolute;left:0;right:0;top:640px;height:128px;z-index:5;display:flex;gap:8px;align-items:flex-end;padding:0 16px 34px;overflow-x:auto;scrollbar-width:none;pointer-events:none;opacity:0;transition:opacity .3s}
  .tray::-webkit-scrollbar{display:none}
  .phone.picked .tray{pointer-events:auto;opacity:1}
  .phone.picked .bub{opacity:0}
  .grp{display:flex;gap:6px;align-items:flex-end;padding-right:6px;margin-right:4px;border-right:1.5px dashed rgba(90,55,20,.35)}
  .grp:last-child{border:none}
  .it{flex-shrink:0;width:58px;text-align:center;animation:itIn .45s cubic-bezier(.3,1.5,.5,1) both;cursor:pointer}
  .it .pic{width:58px;height:58px;border-radius:8px;background:#FFFDF6 center/cover;border:3px solid #fff;box-shadow:0 3px 4px rgba(61,43,31,.3)}
  .it.food .pic,.it.cat .pic{background-size:contain;background-repeat:no-repeat;border:none;box-shadow:none;background-color:transparent;filter:drop-shadow(0 3px 2px rgba(61,43,31,.3))}
  .it span{display:block;margin-top:3px;font:800 10.5px/1.2 var(--f);color:#4A2E14;white-space:nowrap}
  .it.lock .pic{filter:grayscale(1) brightness(.7) opacity(.45)}
  .it.lock span{color:#7A5A3A}
  .gl{flex-shrink:0;align-self:center;writing-mode:vertical-rl;font:900 11px var(--f);color:#5A3A1A;letter-spacing:.2em;margin-bottom:12px}
  @keyframes itIn{from{opacity:0;transform:translateY(-30px) scale(.8)}to{opacity:1;transform:none}}
  .label{position:absolute;left:12px;right:12px;top:796px;padding:5px 0;border-radius:999px;background:rgba(255,253,246,.85);text-align:center;font:700 12px var(--f);color:#4E6B4A;opacity:0;transition:opacity .3s}
  .phone.picked .label{opacity:1}
</style>
</head>
<body>
<div class="side">
  <h1>冰室・收集牆（草稿）</h1>
  <p>照你給的版面做：上面是<b>掛在牆上的香港地圖</b>，五張便利貼釘在各區；下面是<b>綠色磁磚牆＋木桌</b>，Lucky 坐在桌上提示。</p><br>
  <p><b>點點看</b>：點任何一張便利貼 → 那張放大、其他變淡 → <b>桌面上依序落下這一區的「地點／美食／Lucky」</b>，收集到的是彩色、還沒收集的是灰色剪影；Lucky 退到旁邊。再點同一張或空白處收起。</p><br>
  <p>便利貼上的小標籤是這區的進度（示範資料：只收集了理工大學）。喜歡的話我再換掉 App 裡現在的冰室。</p>
</div>
<div class="phone" id="ph">
  <button class="back" aria-label="返回"></button>
  <div class="ttl">冰室</div>
  <div class="frame">
    <div class="map" id="map"><div class="base"></div>
      <svg class="routes" viewBox="0 0 386 330" preserveAspectRatio="none"><path d="M20 80 C80 120 140 60 200 110 S300 170 370 120 M60 250 C120 210 180 260 240 230 S330 200 370 260 M120 40 C150 140 180 200 210 300" fill="none" stroke="#C49A5A" stroke-width="1.6" stroke-dasharray="5 5" opacity=".7"/></svg>
    </div>
    <div class="bar t"></div><div class="bar b"></div>
  </div>
  <div class="tiles"></div>
  <div class="table"></div>
  <div class="tray" id="tray"></div>
  <img class="lucky" src="../assets/wardrobe/Lucky.png" alt="">
  <div class="bub" id="bub">點點板子上釘着的地方，<br>看看收集了什麼！</div>
  <div class="label" id="lab"></div>
</div>
<script>
const P='../assets/';
const AREAS=[
  {k:'sw',name:'上環\n中環',x:77,y:218,w:94,r:'0',c:'#F4E2BE',p:'#D9473A',
   loc:[['西港城','story/backgroundwesternmarket.jpeg'],['海安咖啡','story/PhotoScreen.jpg'],['中環街市',''],['舊牛奶公司倉庫',''],['都爹利街石階','']],
   food:[['牛肉治','food/Food-Corned-Beef-Sandwich.png'],['奶油多','food/Food-Butter-Toast.png'],['腸粉','food/Food-Rice-Noodle-Rolls.png'],['樽裝鮮奶','food/Food-Bottled-Milk.png'],['紅豆冰','food/Food-Red-Bean-Ice.png']],
   cat:[['工作中','wardrobe/Lucky1.png'],['下午茶','wardrobe/Lucky2.png']]},
  {k:'mk',name:'旺角\n尖沙咀',x:215,y:232,w:96,r:'0',c:'#F2D5C2',p:'#D9473A',loc:[['尖沙咀海濱',''],['旺角街市','']],food:[['雞蛋仔','food/Food-Egg-Waffle.png'],['咖喱魚蛋','food/Food-Curry-Fish-Balls.png']],cat:[['散步','wardrobe/Lucky3.png']]},
  {k:'kc',name:'九龍城寨\n啟德',x:333,y:296,w:95,r:'0',c:'#F4EBCF',p:'#3E8E4A',loc:[['九龍城寨公園',''],['啟德','']],food:[['菠蘿包','food/Food-Pineapple-Bun.png']],cat:[]},
  {k:'wc',name:'灣仔',x:100,y:330,w:94,r:'0',c:'#FBF6E9',p:'#3F7CC8',loc:[['和昌大押','']],food:[['油雞大髀','food/Food-Soy-Sauce-Chicken-Leg.png']],cat:[['構圖大師','onboarding/hm3-cat.png']]},
  {k:'ot',name:'其他',x:229,y:362,w:93,r:'0',c:'#E6E1D6',p:'#9A9A9A',loc:[['香港理工大學','diary/dex/polyu-1937.jpg',1],['紅磡站','']],food:[['菠蘿油','food/Food-Pineapple-Bun.png',1]],cat:[['學霸 Lucky','wardrobe/Lucky.png',1]]}
];
const ph=document.getElementById('ph'), tray=document.getElementById('tray'), bub=document.getElementById('bub'), lab=document.getElementById('lab');
const paw='<svg viewBox="0 0 24 24" fill="#A8743C"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><circle cx="6" cy="10.5" r="1.9"/><circle cx="9.6" cy="6.5" r="1.9"/><circle cx="14.4" cy="6.5" r="1.9"/><circle cx="18" cy="10.5" r="1.9"/></svg>';
[[40,95],[150,180],[260,120],[320,290],[110,240]].forEach(([x,y])=>{ const d=document.createElement('div'); d.className='paw'; d.style.left=x+'px'; d.style.top=y+'px'; d.innerHTML=paw; document.getElementById('map').appendChild(d); });
let cur=null;
AREAS.forEach((a,i)=>{
  const got=[...a.loc,...a.food,...a.cat].filter(x=>x[2]).length, tot=a.loc.length+a.food.length+a.cat.length;
  const n=document.createElement('div'); n.className='note hint'; n.style.cssText=`left:${a.x}px;top:${a.y}px;--w:${a.w}px;--r:${a.r};--c:${a.c};--p:${a.p};animation-delay:${i*.35}s`;
  n.innerHTML=`<img src="../assets/ui/wall-notes/${a.k}.png" alt="${a.name.replace('\n','')}"><small class="${got?'':'zero'}">${got}/${tot}</small>`;
  n.onclick=e=>{ e.stopPropagation(); pick(a,n); };
  ph.appendChild(n);
});
function pick(a,n){
  document.querySelectorAll('.note').forEach(x=>x.classList.remove('on','hint'));
  if(cur===a){ cur=null; ph.classList.remove('picked'); return; }
  cur=a; n.classList.add('on'); ph.classList.add('picked');
  const mk=(arr,kind)=>arr.map(([nm,img,ok],j)=>`<div class="it ${kind}${ok?'':' lock'}" style="animation-delay:${j*.07}s"><div class="pic" style="background-image:url('${img?P+img:P+'diary/dex/card-locked.png'}')"></div><span>${ok?nm:'？？？'}</span></div>`).join('');
  tray.innerHTML=[['地點',a.loc,'loc'],['美食',a.food,'food'],['Lucky',a.cat,'cat']].filter(g=>g[1].length).map(([t,arr,k])=>`<div class="grp"><span class="gl">${t}</span>${mk(arr,k)}</div>`).join('');
  tray.scrollLeft=0;
  const g=[a.loc,a.food,a.cat].map(x=>x.filter(y=>y[2]).length);
  lab.textContent=`${a.name.replace('\n','・')}｜地點 ${g[0]}/${a.loc.length}・美食 ${g[1]}/${a.food.length}・Lucky ${g[2]}/${a.cat.length}`;
}
ph.onclick=()=>{ if(cur){ cur=null; ph.classList.remove('picked'); document.querySelectorAll('.note').forEach(x=>x.classList.remove('on')); } };
</script>
</body>
</html>
